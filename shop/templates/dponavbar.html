{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'assets/css/payment.css' %}">
</head>
<body>
<!-- HEADER -->
<header class="header">
    <div class="header-inner">

        <div class="logo">
            <a href="https://dpogroup.com/" target="_blank" rel="noopener noreferrer">
                <img src="{% static 'assets/image/dpo/DPOAF.png' %}" alt="DPO Group">
            </a>
        </div>

        <div class="header-right">
            <div class="header-actions">
                <select class="lang-select">
                    <option>English</option>
                    <option>France</option>
                    <option>Swahili</option>
                </select>

                <a href="https://portal.dpopay.com/system/loginpage.asp?loginpage=provider"
                   target="_blank" rel="noopener noreferrer" class="login-btn">
                    Login
                </a>
            </div>
            <div class="timer">
                Please complete your payment within:
                <strong id="countdown">0d 0h 15m 00s</strong>
            </div>


        </div>


    </div>
</header>

</body>

<script>
    // 15 minutes in seconds
    let timeLeft = 15 * 60;

    const countdownEl = document.getElementById("countdown");

    function updateTimer() {

        let days = Math.floor(timeLeft / (24 * 60 * 60));
        let hours = Math.floor((timeLeft % (24 * 60 * 60)) / (60 * 60));
        let minutes = Math.floor((timeLeft % (60 * 60)) / 60);
        let seconds = timeLeft % 60;

        // Always show 2 digits for minutes & seconds
        minutes = minutes.toString().padStart(2, "0");
        seconds = seconds.toString().padStart(2, "0");

        countdownEl.textContent =
            `${days}d ${hours}h ${minutes}m ${seconds}s`;

        if (timeLeft > 0) {
            timeLeft--;
        } else {
            clearInterval(timerInterval);
            countdownEl.textContent = "Session Expired";
        }
    }

    updateTimer(); // Run immediately
    const timerInterval = setInterval(updateTimer, 1000);
</script>

</html>
