{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'assets/css/dponavbar.css' %}">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-inner">

        <div class="logo">
            <a href="https://dpogroup.com/" target="_blank" rel="noopener noreferrer">
                <img src="{% static 'assets/image/dpo/DPOAF.png' %}" alt="DPO Group">
            </a>
        </div>

        <div class="header-right">
            <div class="header-actions">

                <!-- Language Dropdown (UI Only) -->
                <select class="lang-select">
                    <option value="en" selected>English</option>
                    <option value="fr">French</option>
                    <option value="sw">Swahili</option>
                </select>

                <a href="https://portal.dpopay.com/system/loginpage.asp?loginpage=provider"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="login-btn">
                    Login
                </a>

            </div>

            <div class="timer">
                Please complete your payment within:
                <strong id="countdown" style="font-weight: normal">0d 0h 15m 00s</strong>
            </div>
        </div>

    </div>
</header>

</body>

<script>
let timeLeft = 15 * 60;
const countdownEl = document.getElementById("countdown");

function updateTimer() {

    let days = Math.floor(timeLeft / (24 * 60 * 60));
    let hours = Math.floor((timeLeft % (24 * 60 * 60)) / (60 * 60));
    let minutes = Math.floor((timeLeft % (60 * 60)) / 60);
    let seconds = timeLeft % 60;

    minutes = minutes.toString().padStart(2, "0");
    seconds = seconds.toString().padStart(2, "0");

    countdownEl.textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;

    if (timeLeft > 0) {
        timeLeft--;
    } else {
        clearInterval(timerInterval);

        // 🔥 Hide payment content
        document.querySelector("main").style.display = "none";
        document.querySelector(".container.grid + .container.grid").style.display = "none";

        // 🔥 Show timeout overlay
        const overlay = document.getElementById("timeoutOverlay");
        if (overlay) {
            overlay.classList.remove("hidden");
        }
    }
}

updateTimer();
const timerInterval = setInterval(updateTimer, 1000);
</script>

</html>
